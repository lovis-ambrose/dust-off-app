apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to run Proguard on Release builds to minify and obfuscate your code.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC). 
 * If you use Hermes (recommended for smaller size and performance), make sure hermesEnabled is true.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.dustoff"
    defaultConfig {
        applicationId "com.dustoff"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    
    signingConfigs {
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                // Using a relative path that correctly points to the keystore in the app folder
                storeFile file("${project.rootDir}/app/my-release-key.keystore")
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            
            // Enable code minification (removes unused code) and obfuscation using Proguard
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            
            // Remove unused resources (e.g. images, layouts) to reduce APK size
            shrinkResources true
            
            // Optimize the final APK; zipAlign ensures APKs are aligned for best performance
            zipAlignEnabled true
            
            // Disable PNG crunching (only if you’re sure your PNGs are optimized already)
            crunchPngs false
        }
    }
    
    // Split APKs by ABI so that end users download only the native libraries needed for their device.
    splits {
        abi {
            enable true
            reset()
            // Include only the ABIs you need. Removing x86 and x86_64 if not targeting emulators or specific devices.
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }
    
    // Enable bundle splitting by language, screen density, and ABI for further optimization.
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

dependencies {
    // The React Native Gradle Plugin will manage the version for you.
    implementation("com.facebook.react:react-android")
    
    // If using Hermes, ensure hermesEnabled is set (typically in gradle.properties or project ext)
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
